name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Keep the existing required-check name while the work runs in parallel.
    name: Typecheck, test, build
    runs-on: ubuntu-24.04
    needs: [quality, core-tests]
    if: always()
    steps:
      - name: Require all checks and test shards to pass
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          CORE_TESTS_RESULT: ${{ needs.core-tests.result }}
        run: |
          [[ "$QUALITY_RESULT" == "success" && "$CORE_TESTS_RESULT" == "success" ]]

  quality:
    name: Typecheck, lint, build and workspace tests
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:size
      - run: node --test scripts/size-limit.test.cjs
      - run: pnpm -r typecheck
      - run: pnpm lint
        env:
          # Type-aware ESLint exceeds the runner's default ~2 GB heap.
          NODE_OPTIONS: --max-old-space-size=4096
      - run: pnpm format:check
      - run: node --test scripts/distribution-notices.test.cjs scripts/desktop-release.test.cjs scripts/packaged-native-target.test.cjs scripts/packaged-runtime-dependencies.test.cjs
      # Core has its own shards; keep every other workspace's test script here.
      - run: pnpm -r --filter '!@openorc/core' test
        env:
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@openorc.local
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@openorc.local
      - run: pnpm build
        env:
          # Authenticate the website's build-time changelog request.
          GITHUB_TOKEN: ${{ github.token }}

  core-tests:
    name: Core tests (${{ matrix.shard }}/3)
    runs-on: macos-15
    timeout-minutes: 10
    strategy:
      fail-fast: false
      # Three shards leave room for quality and bench within five macOS jobs.
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @openorc/core test --shard=${{ matrix.shard }}/3
        env:
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@openorc.local
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@openorc.local

  windows:
    name: Windows typecheck and build
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:size
      - run: node --test scripts/size-limit.test.cjs
      - run: pnpm -r typecheck
      - run: node --test scripts/distribution-notices.test.cjs scripts/desktop-release.test.cjs scripts/packaged-native-target.test.cjs scripts/packaged-runtime-dependencies.test.cjs
      - run: pnpm format:check
      # The full suite currently includes POSIX-only fixtures (e.g. /bin/sh).
      # Keep running it in the macOS jobs until those tests are portable.
      - run: pnpm build
        env:
          GITHUB_TOKEN: ${{ github.token }}

  bench:
    name: Bridge benchmark
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify benchmark measurement and budget checks
        run: node --test scripts/benchmark-measurement.test.cjs scripts/check-benchmark.test.cjs
      # The benchmarks drive the app through its test switches, which only a QA build carries.
      - id: build
        run: pnpm --filter @openorc/desktop build
        env:
          OPENORC_QA_BUILD: "1"
      - name: Run the bench autorun and enforce budgets
        working-directory: apps/desktop
        env:
          OPENORC_AUTOBENCH: "1"
          OPENORC_AUTOQUIT: "1"
        run: |
          pnpm exec electron . 2>&1 | tee bench.log
          node ../../scripts/check-benchmark.cjs bridge bench.log
      - name: Run the large-thread autorun and enforce budgets
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: apps/desktop
        env:
          OPENORC_AUTOBENCH_THREAD: "1"
          OPENORC_AUTOQUIT: "1"
        run: |
          pnpm exec electron . 2>&1 | tee thread-bench.log
          node ../../scripts/check-benchmark.cjs thread thread-bench.log
      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-reports
          path: |
            apps/desktop/bench.log
            apps/desktop/thread-bench.log
          if-no-files-found: ignore
          retention-days: 7
