name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Keep the existing required-check name while the work runs in parallel.
    name: Typecheck, test, build
    runs-on: ubuntu-24.04
    needs: [quality, core-tests, linux, linux-tests, linux-desktop-tests, linux-core-tests]
    if: always()
    steps:
      - name: Require all checks and test shards to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [[ "$result" != "success" ]]; then echo "::error::A required job ended as $result"; exit 1; fi
          done

  # Typecheck, lint and the format check read the same sources on every system, so Linux runs them once.
  quality:
    name: Typecheck, build and workspace tests
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:size
      - run: node --test scripts/size-limit.test.cjs
      - run: node --test scripts/distribution-notices.test.cjs scripts/desktop-release.test.cjs scripts/packaged-native-target.test.cjs scripts/packaged-runtime-dependencies.test.cjs
      # Core has its own shards. Desktop's jsdom tests time out beside other workspaces and render the same on Linux,
      # which runs them alone; its main-process tests run here after the rest.
      - run: pnpm -r --filter '!@openorc/core' --filter '!@openorc/desktop' test
        env:
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@openorc.local
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@openorc.local
      - run: pnpm --filter @openorc/desktop exec vitest run --project node
        env:
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@openorc.local
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@openorc.local
      - run: pnpm build
        env:
          # Authenticate the website's build-time changelog request.
          GITHUB_TOKEN: ${{ github.token }}

  core-tests:
    name: Core tests (${{ matrix.shard }}/3)
    runs-on: macos-15
    timeout-minutes: 10
    strategy:
      fail-fast: false
      # Three shards leave room for quality and bench within five macOS jobs.
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @openorc/core test --shard=${{ matrix.shard }}/3
        env:
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@openorc.local
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@openorc.local

  windows:
    name: Windows typecheck and build
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:size
      - run: node --test scripts/size-limit.test.cjs
      - run: pnpm -r typecheck
      - run: node --test scripts/distribution-notices.test.cjs scripts/desktop-release.test.cjs scripts/packaged-native-target.test.cjs scripts/packaged-runtime-dependencies.test.cjs
      - run: pnpm format:check
      # The full suite currently includes POSIX-only fixtures (e.g. /bin/sh).
      # Keep running it in the macOS jobs until those tests are portable.
      - run: pnpm build
        env:
          GITHUB_TOKEN: ${{ github.token }}

  linux:
    name: Linux typecheck, lint and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      # Type-aware ESLint holds every tsconfig's program at once (about 5 GB), more than the 7 GB macOS runner
      # can spare, so it runs here on the 16 GB Linux runner.
      - run: pnpm lint
        env:
          NODE_OPTIONS: --max-old-space-size=8192
      - run: pnpm format:check
      - run: node --test scripts/distribution-notices.test.cjs scripts/desktop-release.test.cjs scripts/packaged-native-target.test.cjs scripts/packaged-runtime-dependencies.test.cjs
      - run: pnpm build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # The core the Windows app runs inside a WSL distribution is built on Linux, and otherwise only by a release:
      # a change that breaks its bundle would first show there, after the tag is pushed.
      - run: pnpm --filter @openorc/desktop bundle:wsl

  # Linux runs the whole suite too, split like macOS: Linux runners are plentiful where macOS runners are not.
  linux-tests:
    name: Linux workspace tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter '!@openorc/core' --filter '!@openorc/desktop' test
        env:
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@openorc.local
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@openorc.local

  # Desktop's jsdom tests wait on rendering and time out when other workspaces share the runner.
  linux-desktop-tests:
    name: Linux desktop tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @openorc/desktop test
        env:
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@openorc.local
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@openorc.local

  linux-core-tests:
    name: Linux core tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @openorc/core test --shard=${{ matrix.shard }}/3
        env:
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@openorc.local
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@openorc.local

  bench:
    name: Bridge benchmark
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Electron fetches its binary on first use. Fetch it once, as the desktop tests do, from a mirror whose file must
      # match Electron's own checksums when GitHub's release downloads fail.
      - name: Fetch Electron's binary
        run: node --input-type=module -e "await (await import('./apps/desktop/src/electron-binary.global-setup.ts')).default()"
      - name: Verify benchmark measurement and budget checks
        run: node --test scripts/benchmark-measurement.test.cjs scripts/check-benchmark.test.cjs
      # The benchmarks drive the app through its test switches, which only a QA build carries.
      - id: build
        run: pnpm --filter @openorc/desktop build
        env:
          OPENORC_QA_BUILD: "1"
      - name: Run the bench autorun and enforce budgets
        working-directory: apps/desktop
        env:
          OPENORC_AUTOBENCH: "1"
          OPENORC_AUTOQUIT: "1"
        run: |
          pnpm exec electron . 2>&1 | tee bench.log
          node ../../scripts/check-benchmark.cjs bridge bench.log
      - name: Run the large-thread autorun and enforce budgets
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: apps/desktop
        env:
          OPENORC_AUTOBENCH_THREAD: "1"
          OPENORC_AUTOQUIT: "1"
        run: |
          pnpm exec electron . 2>&1 | tee thread-bench.log
          node ../../scripts/check-benchmark.cjs thread thread-bench.log
      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-reports
          path: |
            apps/desktop/bench.log
            apps/desktop/thread-bench.log
          if-no-files-found: ignore
          retention-days: 7
