packages:
  - apps/*
  - packages/*

allowBuilds:
  electron: true
  esbuild: true
  node-pty: true
  sqlite-vec: true
  electron-winstaller: false
  onnxruntime-node: true
  "@vgpu/adapter-node": false
  webgpu: false

patchedDependencies:
  "@pierre/diffs@1.4.2": patches/@pierre__diffs@1.4.2.patch
  fastembed@2.1.0: patches/fastembed@2.1.0.patch

packageExtensions:
  fastembed@2.1.0:
    dependencies:
      "@huggingface/tokenizers": 0.2.0

# FastEmbed 2.1.0 still requests tar 6; its import compatibility patch is listed above.
overrides:
  "fastembed@2.1.0>tar": 7.5.22
  # Our MiniLM tokenizer adapter replaces the archived native distribution.
  "fastembed@2.1.0>@anush008/tokenizers": "-"
  # Prevent state-selector recursion through jsdom's Element.matches wrapper.
  "jsdom@26.1.0>nwsapi": 2.2.28
